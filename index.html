<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My GeoJSON Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    h1 {
      padding: 0 16px;
    }

    #map {
      height: 80vh;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>My GeoJSON Map</h1>
  <div id="map"></div>

  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Create the map
    const map = L.map('map').setView([49.25, -123.1], 10);

    // Add the background map
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Load your GeoJSON file
    fetch('./geo.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('Could not load geo.json: ' + response.status);
        }
        return response.json();
      })
      .then(data => {
        const geoLayer = L.geoJSON(data, {
          style: {
            color: '#3388ff',
            weight: 2,
            fillColor: '#3388ff',
            fillOpacity: 0.4
          },
          pointToLayer: (feature, latlng) =>
            L.circleMarker(latlng, {
              radius: 6,
              color: '#1450a0',
              fillOpacity: 0.8
            })
        }).addTo(map);

        // Zoom to your data
        if (geoLayer.getLayers().length > 0) {
          map.fitBounds(geoLayer.getBounds(), {
            padding: [20, 20],
            maxZoom: 15
          });
        }
      })
      .catch(error => {
        console.error('Error loading GeoJSON:', error);
        document.body.insertAdjacentHTML(
          'beforeend',
          '<p>Could not load the GeoJSON file. Check the file path and browser console.</p>'
        );
      });
  </script>
</body>
</html>
